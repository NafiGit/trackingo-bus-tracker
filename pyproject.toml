[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trackingo-bus-tracker"
version = "0.1.0"
description = "Live-track a bus from its Trackingo tracking link, using the tracker page's own API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trackingo-tracker = "trackingo_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
